[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mallet92be-disttrain_jd194"
version = "0.1.0"
description = "统计各来源片段的贡献量与占比，标出分布式训练框架工程师·查询改写的语义漂移上最主要的来源"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mallet92be" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://mallet92be.github.io"
Repository = "https://github.com/mallet92be/disttrain_jd194"
Issues = "https://github.com/mallet92be/disttrain_jd194/issues"

[project.scripts]
disttrain_jd194 = "disttrain_jd194:main"

[tool.setuptools]
py-modules = ["disttrain_jd194"]
